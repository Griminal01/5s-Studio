# Publishes the site to GitHub Pages on every push to main.
# One-off setup: repo Settings > Pages > Source = "GitHub Actions".
name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html css js _site/
      # stamp the css and scripts with this commit, so a browser never mixes new pages with cached old files
      - run: sed -i -E "s#(href|src)=\"((css|js)/[^\"]+)\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
