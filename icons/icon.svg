<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1c2250"/>
  <!-- the walls of a floor plan -->
  <rect x="112" y="124" width="288" height="264" rx="14" fill="none" stroke="#fff" stroke-width="22"/>
  <!-- a zone outlined in floor tape -->
  <rect x="160" y="172" width="150" height="110" rx="6" fill="none" stroke="#fec20f" stroke-width="16" stroke-dasharray="34 18"/>
  <!-- items -->
  <rect x="190" y="204" width="46" height="46" rx="6" fill="#fff"/>
  <rect x="254" y="204" width="34" height="46" rx="6" fill="#fec20f"/>
  <rect x="332" y="296" width="44" height="64" rx="6" fill="#fff"/>
  <rect x="160" y="310" width="120" height="50" rx="6" fill="#fec20f"/>
</svg>
