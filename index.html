<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lean Studio</title>
    <meta
      name="description"
      content="Lean Studio: design 5S layouts and floor tape, and solve problems on a fishbone board. Works offline in the browser."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="auth" hidden>
      <div class="authcard">
        <h1>Lean Studio</h1>
        <div id="authBody"></div>
        <p id="authMsg" role="alert"></p>
      </div>
    </div>
    <header class="top">
      <div class="brand">
        <img id="logo" alt="Company logo" hidden />
        <div>
          <h1>Lean Studio</h1>
          <button id="projectIdentity" aria-label="Rename project"></button>
        </div>
      </div>
      <nav class="gnav" id="gnav" aria-label="Sections"></nav>
      <div class="topr">
        <span id="saved" aria-live="polite"></span>
        <button
          id="teamChip"
          class="bkchip"
          hidden
          title="The team folder needs your permission again"
        >
          Team folder: reconnect
        </button>
        <button
          id="bkChip"
          class="bkchip"
          hidden
          title="Download a backup file of everything"
        ></button>
        <button id="bUndo" class="ico" title="Undo (Ctrl+Z)" aria-label="Undo">
          <span aria-hidden="true">↶</span><span class="btxt">Undo</span>
        </button>
        <button id="bRedo" class="ico" title="Redo (Ctrl+Y)" aria-label="Redo">
          <span aria-hidden="true">↷</span><span class="btxt">Redo</span>
        </button>
        <details class="menu filemenu" id="fileMenu">
          <summary>File</summary>
          <div class="pop">
            <button
              id="bSave"
              title="Download a backup file of everything (Ctrl+S)"
            >
              Save project
            </button>
            <button
              id="bOpen"
              title="Open a project file (this studio or the older version)"
            >
              Open a project file…
            </button>
            <hr />
            <button id="bSettings">Settings</button>
          </div>
        </details>
        <button
          id="userBtn"
          class="usr"
          title="Account, projects and team"
        ></button>
      </div>
    </header>
    <div class="stripe"></div>
    <nav class="subnav" id="subnav" aria-label="Pages"></nav>
    <section class="days" id="days" aria-label="Sheets"></section>

    <main class="studio" id="layoutView">
      <aside class="tools" aria-label="Tools">
        <div id="normalTools">
          <h2>Tools</h2>
          <div class="seg" id="toolSeg">
            <button data-tool="select" title="Select and move (V)">
              <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" /></svg
              >Select
            </button>
            <button data-tool="tape" title="Floor tape (T)">
              <svg viewBox="0 0 24 24">
                <path d="M3 18h7V6h11" />
                <path d="M3 21h10V9h8" stroke-dasharray="2 2" /></svg
              >Tape
            </button>
            <button data-tool="area" title="Outline a zone (Q)">
              <svg viewBox="0 0 24 24">
                <path d="M4 7l6-3 9 4-2 11-10 1z" stroke-dasharray="3 2" />
                <circle cx="4" cy="7" r="1.2" />
                <circle cx="10" cy="4" r="1.2" />
                <circle cx="19" cy="8" r="1.2" /></svg
              >Zone
            </button>
            <button data-tool="route" title="Walking or vehicle route (W)">
              <svg viewBox="0 0 24 24">
                <circle cx="5" cy="18" r="2" />
                <path d="M7 17c4-1 2-8 6-9s5 3 8 1" />
                <path d="M18 6l3 3-3 2" /></svg
              >Route
            </button>
            <button data-tool="measure" title="Measure and set scale (M)">
              <svg viewBox="0 0 24 24">
                <path d="M3 16L16 3l5 5L8 21z" />
                <path d="M7 12l2 2M10 9l2 2M13 6l2 2" /></svg
              >Measure
            </button>
            <button data-tool="tag" title="Pin a red tag (G)">
              <svg viewBox="0 0 24 24">
                <path d="M4 4h9l7 8-6 7-8-7z" />
                <circle cx="8.5" cy="8.5" r="1.4" /></svg
              >Red tag
            </button>
            <button data-tool="action" title="Pin an action (A)">
              <svg viewBox="0 0 24 24">
                <path d="M5 21V4" />
                <path d="M5 5h13l-3 4 3 4H5" /></svg
              >Action
            </button>
          </div>
          <div id="toolOpts"></div>
          <h2>Add to layout</h2>
          <p class="small muted" style="margin: 0 0 8px">
            Click to drop in the middle of the view, or drag onto the drawing.
            Sizes are typical; change them once placed.
          </p>
          <input
            id="libSearch"
            type="search"
            placeholder="Search items"
            aria-label="Search items"
          />
          <div class="lib" id="lib"></div>
          <button id="bCustom" style="width: 100%; margin-top: 8px">
            Add custom item
          </button>
          <button id="bFromProject" style="width: 100%; margin-top: 6px">
            Bring items from another project
          </button>
        </div>
        <div id="drawTools" hidden>
          <h2>Drawing tools</h2>
          <div class="seg" id="drawSeg">
            <button data-tool="select" title="Select and move (V)">
              <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" /></svg
              >Select
            </button>
            <button data-tool="wall" title="Draw a wall (W)">
              <svg viewBox="0 0 24 24">
                <path d="M3 20V6h8v6h10" />
                <path d="M6 20V9h2v6h10" stroke-dasharray="1 2" /></svg
              >Wall
            </button>
            <button data-tool="measure" title="Measure and set scale (M)">
              <svg viewBox="0 0 24 24">
                <path d="M3 16L16 3l5 5L8 21z" />
                <path d="M7 12l2 2M10 9l2 2M13 6l2 2" /></svg
              >Measure
            </button>
          </div>
          <div id="drawOpts"></div>
          <h2>Add to the drawing</h2>
          <p class="small muted" style="margin: 0 0 8px">
            Click to drop in the middle of the view. Change the size once
            placed.
          </p>
          <div class="lib" id="fixLib"></div>
          <button id="bCustomFix" style="width: 100%; margin-top: 8px">
            Add custom fixed object
          </button>
        </div>
      </aside>

      <section class="stage">
        <div class="sheetbar">
          <span class="kind" id="kind"></span>
          <input class="name" id="sName" aria-label="Sheet name" />
          <input type="date" id="sDate" aria-label="Sheet date" />
          <label
            >Compare with
            <select id="cmpSel"></select
          ></label>
          <button
            id="bEditDraw"
            title="Add walls, columns and other fixed things to the drawing"
          >
            Edit drawing
          </button>
          <details class="menu" id="layersMenu">
            <summary title="Choose what shows on the drawing">Layers</summary>
            <div class="pop" id="layersPop"></div>
          </details>
          <details class="menu" id="sheetMenu">
            <summary>Sheet</summary>
            <div class="pop" id="sheetPop"></div>
          </details>
        </div>
        <div class="canvas" id="canvas" data-tool="select">
          <svg
            id="svg"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Layout drawing"
          ></svg>
          <div class="scopebar" id="scopeBar" hidden></div>
          <div class="hint" id="hint" hidden></div>
          <div
            class="selbar"
            id="selbar"
            hidden
            role="toolbar"
            aria-label="Selection"
          ></div>
          <div class="editban" id="editBan" hidden>
            <span></span><button id="editBanDone">Done editing</button>
          </div>
          <div class="zoom">
            <button id="zOut" aria-label="Zoom out">−</button
            ><span id="zlabel">100%</span
            ><button id="zIn" aria-label="Zoom in">+</button
            ><button id="zFit" title="Fit drawing (F)">Fit</button>
          </div>
          <div class="scale" id="scale"></div>
        </div>
      </section>

      <aside class="side" aria-label="Details">
        <div class="tabs" id="tabs" role="tablist">
          <button data-tab="item">Item</button>
          <button data-tab="areas">Zones</button>
          <button data-tab="check">Compare</button>
          <button data-tab="move">Routes</button>
          <button data-tab="mark">Tape</button>
          <button data-tab="s5">5S</button>
        </div>
        <div class="pane" id="pane"></div>
      </aside>
    </main>

    <main class="trends" id="regView" hidden></main>
    <main class="trends" id="docView" hidden></main>
    <main class="trends" id="setupView" hidden></main>
    <main class="trends" id="taskView" hidden></main>
    <main class="trends" id="problemView" hidden></main>
    <main class="trends" id="trackView" hidden></main>

    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
    <dialog id="dlg">
      <form method="dialog" id="dlgForm">
        <h3 id="dlgTitle"></h3>
        <div id="dlgBody"></div>
        <div class="acts">
          <button value="cancel" id="dlgCancel" formnovalidate>Cancel</button
          ><button value="ok" class="pri" id="dlgOk">OK</button>
        </div>
      </form>
    </dialog>
    <div id="printDoc"></div>
    <div id="toast" role="status"></div>
    <input type="file" id="fTeam" accept=".json,application/json" hidden />
    <input type="file" id="fProject" accept=".json,application/json" hidden />
    <input
      type="file"
      id="fImage"
      accept="image/png,image/jpeg,image/webp"
      hidden
    />
    <input
      type="file"
      id="fLogo"
      accept="image/png,image/jpeg,image/webp,image/svg+xml"
      hidden
    />
    <input type="file" id="fPhoto" accept="image/*" multiple hidden />
    <script src="js/00-core.js"></script>
    <script src="js/01-catalogue.js"></script>
    <script src="js/02-state.js"></script>
    <script src="js/03-geometry.js"></script>
    <script src="js/04-checks.js"></script>
    <script src="js/05-storage.js"></script>
    <script src="js/06-ui-helpers.js"></script>
    <script src="js/07-canvas.js"></script>
    <script src="js/08-actions.js"></script>
    <script src="js/09-sheets.js"></script>
    <script src="js/10-render.js"></script>
    <script src="js/11-side-panel.js"></script>
    <script src="js/12-views.js"></script>
    <script src="js/13-exports.js"></script>
    <script src="js/14-project-files.js"></script>
    <script src="js/15-settings-keyboard.js"></script>
    <script src="js/16-app.js"></script>
    <script src="js/17-pins.js"></script>
    <script src="js/18-shared-helpers.js"></script>
    <script src="js/19-forms.js"></script>
    <script src="js/20-registers.js"></script>
    <script src="js/21-documents.js"></script>
    <script src="js/22-drawing-editor.js"></script>
    <script src="js/23-floor-marking.js"></script>
    <script src="js/24-example-project.js"></script>
    <script src="js/25-tracking.js"></script>
    <script src="js/26-project-ui.js"></script>
    <script src="js/27-drift-map.js"></script>
    <script src="js/32-accounts.js"></script>
    <script src="js/33-team.js"></script>
    <script src="js/34-areas.js"></script>
    <script src="js/34-import.js"></script>
    <script src="js/34-setup.js"></script>
    <script src="js/34-tasks.js"></script>
    <script src="js/35-problems.js"></script>
    <script src="js/36-problem-tools.js"></script>
    <script src="js/37-layout-edit.js"></script>
    <script src="js/38-problem-board.js"></script>
    <script src="js/39-document-map.js"></script>
    <script src="js/40-main.js"></script>
  </body>
</html>
